name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Install the toolchain in lean-toolchain, build the library and run
      # `lake test`.
      - uses: leanprover/lean-action@v1
        with:
          test: true

      # Make sure the example in the README still builds.
      - name: Build the example
        run: lake build SpecRefExamples
